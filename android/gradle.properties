org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.overridePathCheck=true

kotlin.jvm.target.validation.mode=warning

# permission_handler: disable unused permission sub-plugins to prevent
# READ_MEDIA_IMAGES / READ_MEDIA_VIDEO from being merged into the manifest
# (Google Play Photos & Videos policy violation fix)
PERMISSION_HANDLER_PHOTOS_PERMISSION=0
PERMISSION_HANDLER_VIDEOS_PERMISSION=0
PERMISSION_HANDLER_MEDIA_LIBRARY_PERMISSION=0
PERMISSION_HANDLER_STORAGE_PERMISSION=0
PERMISSION_HANDLER_AUDIO_PERMISSION=0
