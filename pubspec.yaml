name: vitacase
description: VitaCase - Privacy-first offline personal document vault
publish_to: "none"
version: 1.1.0+33

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.9

  # Firebase
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1

  # Local Database
  sembast: ^3.8.6
  path: ^1.9.1

  # File System
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  open_filex: ^4.7.0

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  permission_handler: ^12.0.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  shared_preferences: ^2.5.2
  google_fonts: ^8.0.2
  local_auth: ^3.0.1
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  archive: ^4.0.9

  # Monetization & Ads
  google_mobile_ads: ^8.0.0

  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.7
  sentry_flutter: ^9.17.0
  url_launcher: ^6.3.2
  go_router: ^17.2.0
  in_app_review: ^2.0.11
  package_info_plus: ^8.2.1
  flutter_native_splash: ^2.4.4
  flutter_markdown: ^0.7.7+1
  firebase_messaging: ^15.2.10
  flutter_slidable: ^4.0.3
  haptic_feedback: ^0.6.4+3
  awesome_notifications: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/legal/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
  fullscreen: true
